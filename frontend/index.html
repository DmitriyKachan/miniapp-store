<!doctype html>
<html lang="uk" class="dark" style="color-scheme: dark; background-color: #0f1115;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#181b20" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Flowers Lviv | Квіти Львів • Доставка букетів (@flowers___lviv)</title>
    <meta name="description" content="Студія квітів Flowers Lviv: свіжі авторські букети, троянди, коробки квітів. Доставка по Львову від 60 хв. м. Львів, вул. Топольна, 4В. Instagram: @flowers___lviv" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#181b20');
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#0f1115');
            if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor('#181b20');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0f1115] text-[#f4f4f5] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
